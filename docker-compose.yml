services:
  # The app: Python (FastAPI/DSPy) backend + bundled CLIProxyAPI + the built React SPA, all in
  # one container on :3000. (The TS backend has been retired — see server-py/docs/CUTOVER.md.)
  dana:
    build:
      context: .
      dockerfile: server-py/Dockerfile
    environment:
      PORT: 3000
      DATA_DIR: /data
      SEARXNG_URL: http://searxng:8080
      # CLIProxyAPI runs inside this container; PROXY_BASE_URL defaults to 127.0.0.1:8317
      # (set in the Dockerfile). MANAGEMENT_SECRET is generated/persisted by the entrypoint
      # to /data/.management-secret unless provided here.
      MANAGEMENT_SECRET: ${MANAGEMENT_SECRET:-}
      # Playwright-grade fetch via the opt-in `dana firecrawl` stack (host :3002); used
      # automatically once it's up, otherwise fetches fall back to trafilatura/Jina.
      FIRECRAWL_URL: ${FIRECRAWL_URL:-http://host.docker.internal:3002}
    ports:
      - "3000:3000"
      - "54545:54545"   # CLIProxyAPI OAuth callback
      - "1455:1455"     # CLIProxyAPI OAuth callback
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      searxng:
        condition: service_started
    restart: unless-stopped
    networks:
      - dana-net

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped
    depends_on:
      tor1:
        condition: service_started
    networks:
      - dana-net

  # Tor SOCKS5 egress pool (:9150) — SearXNG routes EVERY engine request through
  # these (searxng/settings.yml `outgoing.proxies`) and round-robins per-request,
  # so engines see many rotating Tor exit IPs instead of this host's blocked
  # datacenter IP. Engine blocking is PER-IP, so we beat it with (1) a LARGE pool
  # (16 instances = 16 simultaneous exits) and (2) FAST rotation: the shared
  # ./searxng/tor/torrc sets MaxCircuitDirtiness 60 so each instance cycles its
  # exit IP ~every 60s. Image is peterdavehello/tor-socks-proxy (actively
  # maintained, tiny; SocksPort is 9150). dperson/torproxy was dropped: abandoned
  # ~5y and it silently ignores TOR_MaxCircuitDirtiness (entrypoint bug #26), so
  # we could not tune rotation on it. We mount our own torrc read-only — the
  # image's CMD is `tor -f /etc/tor/torrc`, so the mount fully controls config.
  tor1: &tor
    image: peterdavehello/tor-socks-proxy:latest
    restart: unless-stopped
    volumes:
      - ./searxng/tor/torrc:/etc/tor/torrc:ro
    networks:
      - dana-net
  tor2:  {<<: *tor}
  tor3:  {<<: *tor}
  tor4:  {<<: *tor}
  tor5:  {<<: *tor}
  tor6:  {<<: *tor}
  tor7:  {<<: *tor}
  tor8:  {<<: *tor}
  tor9:  {<<: *tor}
  tor10: {<<: *tor}
  tor11: {<<: *tor}
  tor12: {<<: *tor}
  tor13: {<<: *tor}
  tor14: {<<: *tor}
  tor15: {<<: *tor}
  tor16: {<<: *tor}

networks:
  dana-net:
    driver: bridge
