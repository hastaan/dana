services:
  # The app: Python (FastAPI/DSPy) backend + bundled CLIProxyAPI + the built React SPA, all in
  # one container on :3000. (The TS backend has been retired — see server-py/docs/CUTOVER.md.)
  dana:
    build:
      context: .
      dockerfile: server-py/Dockerfile
    environment:
      PORT: 3000
      DATA_DIR: /data
      SEARXNG_URL: http://searxng:8080
      # CLIProxyAPI runs inside this container; PROXY_BASE_URL defaults to 127.0.0.1:8317
      # (set in the Dockerfile). MANAGEMENT_SECRET is generated/persisted by the entrypoint
      # to /data/.management-secret unless provided here.
      MANAGEMENT_SECRET: ${MANAGEMENT_SECRET:-}
      # Playwright-grade fetch via the opt-in `dana firecrawl` stack (host :3002); used
      # automatically once it's up, otherwise fetches fall back to trafilatura/Jina.
      FIRECRAWL_URL: ${FIRECRAWL_URL:-http://host.docker.internal:3002}
    ports:
      - "3000:3000"
      - "54545:54545"   # CLIProxyAPI OAuth callback
      - "1455:1455"     # CLIProxyAPI OAuth callback
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      searxng:
        condition: service_started
    restart: unless-stopped
    networks:
      - dana-net

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped
    depends_on:
      tor1:
        condition: service_started
    networks:
      - dana-net

  # Tor SOCKS5 proxies (:9050) — SearXNG routes every engine request through them (see
  # searxng/settings.yml `outgoing.proxies`) so engines see rotating Tor exit IPs, not this
  # host's blocked datacenter IP. Search engines block MANY Tor exits, so we run a POOL:
  # SearXNG rotates across them, and web_search retries on empty — the more exits, the lower
  # the odds that every exit a query touches is simultaneously blocked. Same image
  # localfirecrawl uses for its egress.
  tor1: &tor
    image: dperson/torproxy
    restart: unless-stopped
    networks:
      - dana-net
  tor2: {<<: *tor}
  tor3: {<<: *tor}
  tor4: {<<: *tor}
  tor5: {<<: *tor}
  tor6: {<<: *tor}

networks:
  dana-net:
    driver: bridge
