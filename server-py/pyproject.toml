[project]
name = "dana-server"
version = "0.1.0"
description = "Dana — Python + DSPy, STORM-powered backend (rewrite of the TS/Bun backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
# DSPy stack — added in Phase 1 (research engine). Kept optional so Phase-0 plumbing
# installs fast and the app runs without the heavier ML deps.
dspy = ["dspy>=2.5", "litellm>=1.50"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dana"]
