[project]
name = "dana-server"
version = "0.1.0"
description = "Dana — Python + DSPy, STORM-powered backend (rewrite of the TS/Bun backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "trafilatura>=2.0",
    "curl-cffi>=0.7",
]

[project.optional-dependencies]
# DSPy stack — added in Phase 1 (research engine). Kept optional so Phase-0 plumbing
# installs fast and the app runs without the heavier ML deps.
dspy = ["dspy>=2.5", "litellm>=1.50"]
# Dev tooling: pure-logic unit tests (no network/LLM). `uv sync --extra dev` or
# `uv run --extra dev pytest`.
dev = ["pytest>=8.0"]

[dependency-groups]
# Same set exposed as a PEP 735 dependency-group so `uv run pytest` picks it up by default.
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
# Only the pure-logic unit tests (test_*.py); the smoke_*.py scripts hit the DB/LLM and are
# run by hand, not in CI. pythonpath=src lets `import dana...` resolve from the src layout.
addopts = "-q"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dana"]
