# SearXNG config for Dana's JSON-API use.
#
# Keep the BROAD default engine set (use_default_settings: true) for resilience: many engines
# means some always answer even when a few are momentarily rate-limited. Narrowing to a small
# whitelist was a mistake — `keep_only` doesn't enable engines that ship disabled-by-default
# (bing/qwant/mojeek), so it collapsed the active set to ~4 and starved results. We only turn
# OFF the engines that produce pure log spam from a server IP (DuckDuckGo's CAPTCHA tracebacks).
# Dana's web_search tolerates any single engine failing, so breadth here is the robustness.
use_default_settings: true

search:
  formats:
    - html
    - json
  default_lang: all

server:
  limiter: false
  secret_key: "4ced9d1ff16fbce79a94aea9c729277b6f755f02c68fd973"

engines:
  - name: duckduckgo
    engine: duckduckgo
    disabled: true
    shortcut: ddg
