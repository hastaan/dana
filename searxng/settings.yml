# SearXNG config for Dana's JSON-API use.
#
# BROAD engine set for coverage: from a server IP no single engine is reliable (google blocks,
# bing intermittently serves anti-bot fallback junk, others CAPTCHA/403), so breadth maximizes
# the chance that SOME engine returns relevant hits. Dana's web_search is failure-tolerant AND
# applies a relevance FLOOR (drops zero-query-overlap junk), so the breadth costs only some log
# noise — never nonsense results. DuckDuckGo is omitted: from a datacenter IP it only emits
# CAPTCHA tracebacks (0 results) and is the loudest log spammer.
use_default_settings:
  engines:
    keep_only:
      - google
      - bing
      - brave
      - startpage
      - qwant
      - mojeek
      - wikipedia

search:
  formats:
    - html
    - json
  default_lang: all

server:
  limiter: false
  secret_key: "4ced9d1ff16fbce79a94aea9c729277b6f755f02c68fd973"

# Route every engine request through Tor so search engines see rotating Tor exit IPs
# instead of this server's (blocked) datacenter IP. The `tor` service (dperson/torproxy)
# exposes SOCKS5 on :9050; socks5h:// resolves DNS through Tor too. Tor circuits are slow,
# so timeouts are raised. If `tor` is down, SearXNG simply can't reach engines (honest empty).
outgoing:
  request_timeout: 12.0
  max_request_timeout: 20.0
  pool_connections: 100
  pool_maxsize: 20
  proxies:
    all://:
      - socks5h://tor1:9050
      - socks5h://tor2:9050
      - socks5h://tor3:9050
      - socks5h://tor4:9050
      - socks5h://tor5:9050
      - socks5h://tor6:9050

engines:
  - {name: google, engine: google, disabled: false, shortcut: g}
  - {name: bing, engine: bing, disabled: false, shortcut: bi}
  - {name: brave, engine: brave, disabled: false, shortcut: br}
  - {name: startpage, engine: startpage, disabled: false, shortcut: sp}
  - {name: qwant, engine: qwant, disabled: false, shortcut: qw}
  - {name: mojeek, engine: mojeek, disabled: false, shortcut: mj}
  - {name: wikipedia, engine: wikipedia, disabled: false, shortcut: wp}
